name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          keychain="$RUNNER_TEMP/vdl-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$SIGNING_IDENTITY"

      - name: Prepare notarization and update-signing keys
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          UPDATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOTARY_KEY_BASE64"
          test -n "$UPDATE_KEY_BASE64"
          test -n "$UPDATE_PUBLIC_KEY_BASE64"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$UPDATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/update-signing.pem"
          printf '%s' "$UPDATE_PUBLIC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/update-public-key.pem"
          chmod 600 "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/update-signing.pem"

      - name: Build, sign, notarize, and verify release archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          UPDATE_SIGNING_KEY: ${{ runner.temp }}/update-signing.pem
          UPDATE_PUBLIC_KEY_PATH: ${{ runner.temp }}/update-public-key.pem
        run: ./scripts/release_app.sh "${GITHUB_REF_NAME#v}"

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: .dist/iOS-Virtual-Device-Lab-*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .dist/iOS-Virtual-Device-Lab-*.zip \
            .dist/iOS-Virtual-Device-Lab-*.sha256 \
            .dist/update-manifest.json \
            .dist/update-manifest.json.sig \
            .dist/sbom.cdx.json \
            .dist/supply-chain-manifest.json \
            .dist/build-provenance.json \
            .dist/build-provenance.json.sig \
            --generate-notes \
            --title "iOS Virtual Device Lab $GITHUB_REF_NAME"
