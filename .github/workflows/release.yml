name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release_app.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .dist/iOS-Virtual-Device-Lab-*.zip \
            .dist/iOS-Virtual-Device-Lab-*.sha256 \
            --generate-notes \
            --title "iOS Virtual Device Lab $GITHUB_REF_NAME"
